# Legacy v1 compatibility example. New studies should start from the
# stage_explicit_* v2 examples in this directory.
config_version: 1

input:
  cif_path: structure.cif
  cif_frame: 0
  supercell: [1, 1, 1]
  expected_atom_count: 400
  expected_formula: null
  reject_partial_occupancy: true

calculator:
  kind: mace
  factory: null
  foundation_model: medium-mpa-0
  kwargs: {}
  model_path: null
  model_sha256: null
  device: auto
  dtype: float64
  allow_download: true
  required_properties: [energy, forces, stress]

protocol:
  control_mode: volume_ramp
  temperature_K: 300.0
  timestep_fs: 0.5
  random_seed: 20260901
  remove_center_of_mass_momentum: true

  thermostat:
    # Prescribed compression/decompression ramps currently require Bussi.
    # Selecting nose_hoover_chain with a ramp is rejected because that
    # integrator is not implemented.
    kind: bussi
    tau_fs: 100.0

  barostat:
    kind: isotropic_mtk
    thermostat_tau_fs: 100.0
    barostat_tau_fs: 1000.0

  stages:
    - kind: initial_nvt
      name: initial_300K
      duration_ps: 30.0
      sampling_window_ps: 10.0
      initialize_velocities: true

    - kind: compression
      name: cold_compression
      duration_ps: 150.0
      target_volume_ratio: 0.7
      schedule: log_smoothstep

    - kind: peak_nvt
      name: high_density_hold
      duration_ps: 100.0
      sampling_window_ps: 80.0

    - kind: decompression
      name: decompression
      duration_ps: 200.0
      # Relative to the beginning of this stage: 1 / 0.7 returns to V0.
      # Do not assume that V0 is the correct zero-pressure recovered volume.
      target_volume_ratio: 1.4285714285714286
      schedule: log_smoothstep

    # Optional 0 GPa recovery: this deliberately changes from the Bussi ramp to
    # the NHC thermostat + MTK barostat at an explicit stage boundary. The
    # transition is legitimate, but discard its equilibration transient and do
    # not calculate dynamical correlations across the boundary.
    - kind: recovery_npt
      name: zero_pressure_recovery
      duration_ps: 75.0
      sampling_window_ps: 25.0
      target_pressure_GPa: 0.0

    # This fixed-cell stage returns to the protocol's Bussi thermostat. Treat
    # this boundary with the same equilibration and analysis rule stated above.
    - kind: final_nvt
      name: recovered_glass_aging
      duration_ps: 200.0
      sampling_window_ps: 150.0

output:
  directory: coldmd-run
  trajectory_filename: trajectory.traj
  thermo_filename: thermo.csv
  log_filename: coldmd.log
  thermo_interval_steps: 10
  trajectory_interval_steps: 100
  checkpoint_interval_steps: 10000
  write_forces: true
  write_stress: true
  write_momenta: true
  write_stage_structures: true

safety:
  min_temperature_K: 1.0
  max_temperature_K: 1500.0
  max_abs_pressure_GPa: 200.0
  max_force_eV_A: 200.0
  min_distance_A: 0.5
  min_volume_ratio: 0.5
  max_volume_ratio: 1.5
  max_abs_log_volume_strain_per_step: 0.001
  max_cell_condition_number: 10000.0
  max_deviatoric_stress_GPa: 100.0
  abort_on_nonfinite: true
  checkpoint_on_abort: true
  maximum_consecutive_violations: 1
