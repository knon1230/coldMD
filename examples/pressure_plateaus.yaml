# Legacy v1 compatibility example. New studies should start from the
# stage_explicit_* v2 examples in this directory.
config_version: 1

input:
  cif_path: structure.cif
  cif_frame: 0
  supercell: [1, 1, 1]
  expected_atom_count: 400
  expected_formula: null
  reject_partial_occupancy: true

calculator:
  kind: mace
  factory: null
  # Convenient for testing, but strict resume requires a local model_path and
  # model_sha256. `coldmd validate` and the launcher emit this warning.
  foundation_model: medium-mpa-0
  kwargs: {}
  model_path: null
  model_sha256: null
  device: auto
  dtype: float64
  allow_download: true
  required_properties: [energy, forces, stress]

protocol:
  control_mode: pressure_plateaus
  temperature_K: 300.0
  timestep_fs: 0.5
  random_seed: 20260901
  remove_center_of_mass_momentum: true

  thermostat:
    # Use Nose–Hoover chain for initial/final fixed-cell NVT as well as the
    # thermostat family embedded in the MTK NPT plateaus.
    kind: nose_hoover_chain
    tau_fs: 100.0
    chain_length: 3
    substeps: 2

  barostat:
    kind: isotropic_mtk
    thermostat_tau_fs: 100.0
    barostat_tau_fs: 1000.0
    thermostat_chain_length: 3
    barostat_chain_length: 3
    thermostat_substeps: 2
    barostat_substeps: 2

  stages:
    - kind: initial_nvt
      name: initial_300K
      duration_ps: 30.0
      sampling_window_ps: 10.0
      initialize_velocities: true

    # Expands deterministically to compression_0GPa ... compression_10GPa.
    - kind: pressure_range
      name_prefix: compression
      branch: cold_compression
      start_pressure_GPa: 0.0
      end_pressure_GPa: 10.0
      pressure_step_GPa: 1.0
      duration_ps: 20.0
      sampling_window_ps: 10.0

    # The 10 GPa endpoint is already present above, so decompression starts at 9.
    - kind: pressure_range
      name_prefix: decompression
      branch: decompression
      start_pressure_GPa: 9.0
      end_pressure_GPa: 0.0
      pressure_step_GPa: 1.0
      duration_ps: 20.0
      sampling_window_ps: 10.0

    - kind: recovery_npt
      name: zero_pressure_recovery
      target_pressure_GPa: 0.0
      duration_ps: 75.0
      sampling_window_ps: 25.0

    - kind: final_nvt
      name: recovered_glass_aging
      duration_ps: 200.0
      sampling_window_ps: 150.0

output:
  directory: coldmd-pressure-run
  trajectory_filename: trajectory.traj
  thermo_filename: thermo.csv
  log_filename: coldmd.log
  thermo_interval_steps: 10
  trajectory_interval_steps: 100
  checkpoint_interval_steps: 10000

safety:
  min_temperature_K: 1.0
  max_temperature_K: 1500.0
  max_abs_pressure_GPa: 200.0
  max_force_eV_A: 200.0
  min_distance_A: 0.5
  min_volume_ratio: 0.5
  max_volume_ratio: 1.5
  max_abs_log_volume_strain_per_step: 0.001
  max_cell_condition_number: 10000.0
  max_deviatoric_stress_GPa: 100.0
  abort_on_nonfinite: true
  checkpoint_on_abort: true
  maximum_consecutive_violations: 1
